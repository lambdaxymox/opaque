[package]
name = "opaque_vec"
version = "1.4.0"
edition = "2024"
publish = false

[features]
default = ["std"]
std = ["opaque_alloc/std", "opaque_error/std", "opaque_polyfill/std"]
nightly = ["opaque_alloc/nightly"]

[dependencies]

[dependencies.opaque_alloc]
version = "1.4.0"
path = "../opaque_alloc"

[dependencies.opaque_error]
version = "1.4.0"
path = "../opaque_error"

[dependencies.opaque_polyfill]
version = "1.4.0"
path = "../opaque_polyfill"

[dev-dependencies]

[dev-dependencies.criterion]
version = "0.8.2"

[dev-dependencies.proptest]
version = "1.12.0"

[lints.rust.unexpected_cfgs]
level = "warn"

[[bench]]
name = "bench_type_erased_vec"
harness = false
path = "benches/lib.rs"
