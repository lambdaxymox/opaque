[package]
name = "opaque_vec"
version = "2.0.0"
edition = "2024"
publish = false

[features]
default = ["std"]
std = ["opaque_alloc/std", "opaque_error/std", "opaque_polyfill/std"]
nightly = ["opaque_alloc/nightly"]

[dependencies]
opaque_alloc = { path = "../opaque_alloc", version = "2.0.0" }
opaque_error = { path = "../opaque_error", version = "2.0.0" }
opaque_polyfill = { path = "../opaque_polyfill", version = "2.0.0" }

[dev-dependencies]
criterion = { version = "0.8.2" }
proptest = { version = "1.12.0" }

[lints.rust.unexpected_cfgs]
level = "warn"

[[bench]]
name = "bench_type_erased_vec"
harness = false
path = "benches/lib.rs"
