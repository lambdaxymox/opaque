[package]
name = "opaque_index_map"
version = "2.0.0"
edition = "2024"
publish = false

[features]
default = ["std"]
std = ["opaque_alloc/std", "opaque_error/std", "opaque_hash/std", "opaque_vec/std"]
nightly = ["opaque_alloc/nightly", "opaque_hash/nightly", "opaque_vec/nightly"]

[dependencies]
opaque_alloc = { path = "../opaque_alloc", version = "2.0.0" }
opaque_error = { path = "../opaque_error", version = "2.0.0" }
opaque_hash = { path = "../opaque_hash", version = "2.0.0" }
opaque_vec = { path = "../opaque_vec", version = "2.0.0" }

equivalent = { version = "1.0.3", default-features = false }
hashbrown = { version = "0.17.1" }

[dev-dependencies]
criterion = { version = "0.8.2" }
proptest = { version = "1.12.0"}
indexmap = { version = "2.14.2" }

[[bench]]
name = "bench_type_erased_index_map"
harness = false
path = "benches/lib.rs"
