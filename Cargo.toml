[package]
name = "opaque"
version = "2.0.0"
rust-version = "1.100.0"
edition = "2024"
authors = ["LambdaXymox <lambda.xymox@gmail.com>"]
description = "A library for working with type-erased generic collections."
categories = [
    "data-structures",
    "no-std",
]
keywords = [
    "no_std",
    "type-erased",
    "heterogeneous",
    "containers",
]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/lambdaxymox/opaque"

[lib]
name = "opaque"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = ["std"]
std = [
    "opaque_alloc/std",
    "opaque_error/std",
    "opaque_hash/std",
    "opaque_index_map/std",
    "opaque_vec/std",
]
nightly = [
    "opaque_alloc/nightly",
    "opaque_hash/nightly",
    "opaque_index_map/nightly",
    "opaque_vec/nightly",
]

[dependencies]
opaque_alloc = { path = "crates/opaque_alloc", version = "2.0.0" }
opaque_error = { path = "crates/opaque_error", version = "2.0.0" }
opaque_hash = { path = "crates/opaque_hash", version = "2.0.0" }
opaque_vec = { path = "crates/opaque_vec", version = "2.0.0" }
opaque_index_map = { path = "crates/opaque_index_map", version = "2.0.0" }

[workspace]
members = [
    "crates/*"
]
